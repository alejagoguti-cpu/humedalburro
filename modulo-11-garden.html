<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Jardín de las Aguas — Kennedy en Partículas 3D</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030508;
    --accent: #00f0ff;
    --emerald: #10b981;
    --gold: #fbbf24;
    --ink: #f8fafc;
    --ink-dim: rgba(248, 250, 252, 0.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--ink); font-family: 'Inter', sans-serif;
  }

  #canvasContainer {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
    cursor: grab;
  }
  #canvasContainer:active { cursor: grabbing; }
  #sceneCanvas { display: block; width: 100%; height: 100%; }

  /* Vignette & Cinematic Film Grain */
  .vignette-overlay {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(circle at center, transparent 30%, rgba(2, 4, 8, 0.65) 75%, #020306 100%);
  }

  /* Top Navigation Bar */
  .top-bar {
    position: absolute; top: 28px; left: 0; width: 100%; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 36px; pointer-events: none;
  }
  .nav-back-link {
    pointer-events: auto; display: inline-flex; align-items: center; gap: 10px;
    color: var(--ink-dim); text-decoration: none; font-size: 11px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; transition: all 0.3s ease;
    padding: 8px 16px; border-radius: 20px; background: rgba(10, 16, 26, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px);
  }
  .nav-back-link:hover {
    color: var(--accent); border-color: rgba(0, 240, 255, 0.4);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.25); transform: translateX(-2px);
  }

  .top-center-brand {
    text-align: center; pointer-events: none;
  }
  .top-center-brand h1 {
    font-family: 'Cinzel', serif; font-size: 16px; font-weight: 600;
    letter-spacing: 0.28em; text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.65) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .top-center-brand p {
    font-family: 'IBM Plex Mono', monospace; font-size: 9.5px;
    letter-spacing: 0.24em; color: var(--accent); text-transform: uppercase; margin-top: 3px;
    opacity: 0.85;
  }

  .sound-btn {
    pointer-events: auto; width: 38px; height: 38px; border-radius: 50%;
    background: rgba(10, 16, 26, 0.45); border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--ink-dim); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(12px); font-size: 13px;
  }
  .sound-btn:hover, .sound-btn.active {
    color: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 18px rgba(0, 240, 255, 0.35); transform: scale(1.05);
  }

  /* Bottom Minimalist Cinematic Scrub Bar */
  .bottom-experience-bar {
    position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: auto;
  }
  .scrub-container {
    display: flex; align-items: center; gap: 20px; padding: 12px 28px;
    background: rgba(8, 13, 22, 0.72); border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 40px; backdrop-filter: blur(20px);
    box-shadow: 0 16px 45px rgba(0, 0, 0, 0.8); transition: border-color 0.3s;
  }
  .scrub-container:hover {
    border-color: rgba(0, 240, 255, 0.35);
  }
  .scrub-label {
    font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.16em;
    color: var(--ink-dim); text-transform: uppercase; cursor: pointer; transition: color 0.2s;
  }
  .scrub-label.active, .scrub-label:hover {
    color: #ffffff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
  }
  .experience-toggle-btn {
    padding: 8px 18px; border-radius: 20px; font-family: 'Cinzel', serif;
    font-size: 11px; font-weight: 600; letter-spacing: 0.14em; cursor: pointer;
    border: 1px solid rgba(0, 240, 255, 0.6);
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(16, 185, 129, 0.2));
    color: #ffffff; text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.25); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .experience-toggle-btn:hover {
    transform: scale(1.06); box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
    border-color: #00f0ff;
  }
  .custom-scrub-slider {
    -webkit-appearance: none; width: 180px; height: 3px; background: rgba(255, 255, 255, 0.18);
    border-radius: 2px; outline: none; cursor: pointer; transition: background 0.3s;
  }
  .custom-scrub-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #00f0ff; box-shadow: 0 0 14px #00f0ff, 0 0 28px rgba(0, 240, 255, 0.6);
    cursor: pointer; transition: transform 0.2s;
  }
  .custom-scrub-slider::-webkit-slider-thumb:hover { transform: scale(1.25); }

  .drag-hint {
    font-family: 'IBM Plex Mono', monospace; font-size: 9.5px;
    letter-spacing: 0.2em; color: rgba(255, 255, 255, 0.38); text-transform: uppercase;
  }

  /* Minimalist Loading Veil */
  #loadingVeil {
    position: fixed; inset: 0; z-index: 100; background: #030508;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }
  #loadingVeil.hide { opacity: 0; }
  .veil-title {
    font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.3em;
    color: rgba(255, 255, 255, 0.85); text-transform: uppercase;
  }
  .veil-bar {
    width: 140px; height: 1.5px; background: rgba(255, 255, 255, 0.12);
    position: relative; overflow: hidden;
  }
  .veil-bar-fill {
    position: absolute; top: 0; left: 0; height: 100%; width: 50%;
    background: var(--accent); box-shadow: 0 0 10px var(--accent);
    animation: veilPulse 1.4s ease-in-out infinite alternate;
  }
  @keyframes veilPulse {
    0% { left: 0%; width: 20%; }
    100% { left: 80%; width: 30%; }
  }
</style>

<!-- Three.js, OrbitControls, GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

<div id="loadingVeil">
  <div class="veil-title">EL JARDÍN DE LAS AGUAS</div>
  <div class="veil-bar"><div class="veil-bar-fill"></div></div>
</div>

<div class="vignette-overlay"></div>

<!-- Top Minimalist Bar -->
<div class="top-bar">
  <a href="modulo-08-3d.html" class="nav-back-link">
    <i class="fa-solid fa-arrow-left"></i> Axonometría
  </a>
  <div class="top-center-brand">
    <h1>El Jardín de las Aguas</h1>
    <p>Kennedy · Nube de Partículas 3D</p>
  </div>
  <button id="soundToggle" class="sound-btn" title="Paisaje Sonoro de Penderecki">
    <i class="fa-solid fa-volume-xmark"></i>
  </button>
</div>

<!-- Bottom Minimalist Experience Bar -->
<div class="bottom-experience-bar">
  <div class="scrub-container">
    <span class="scrub-label" id="labelAssemble">Territorio</span>
    <input type="range" id="experienceSlider" class="custom-scrub-slider" min="0" max="100" value="0">
    <span class="scrub-label" id="labelNebula">Nebulosa</span>
    <button id="btnPlayTransition" class="experience-toggle-btn">
      <i class="fa-solid fa-atom"></i> <span id="btnActionText">DESINTEGRAR</span>
    </button>
  </div>
  <div class="drag-hint">Gira 360° · Rueda para Zoom · Desliza para Dispersión</div>
</div>

<div id="canvasContainer">
  <canvas id="sceneCanvas"></canvas>
</div>

<script src="modulo-11-garden.js?v=20261006_03"></script>
</body>
</html>
