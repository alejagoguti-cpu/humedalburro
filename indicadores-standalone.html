<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indicadores Territoriales - Humedal Burro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-dark: #000000;
      --accent: #84A48B;
      --accent-glow: rgba(132, 164, 139, 0.45);
      --ink: #f1f5f9;
      --ink-dim: #94a3b8;
      --glass-bg: rgba(6, 9, 15, 0.92);
      --glass-border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background-color: #000000;
      color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-size: 12px; -webkit-font-smoothing: antialiased;
    }
    #canvasContainer { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; cursor: crosshair; }
    #sceneCanvas { display: block; width: 100%; height: 100%; }
    .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 8px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85); }
    .top-header { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; z-index: 100; flex-wrap: wrap; gap: 6px; transition: opacity 0.4s ease, transform 0.4s ease; }
    .nav-group { display: flex; align-items: center; gap: 5px; pointer-events: auto; flex-wrap: wrap; }
    .brand-title { padding: 5px 10px; font-weight: 800; letter-spacing: 0.5px; color: var(--accent); display: flex; align-items: center; gap: 6px; font-size: 10.5px; text-transform: uppercase; white-space: nowrap; }
    .btn-flat { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12); color: #cbd5e1; padding: 5px 9px; border-radius: 6px; font-size: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; transition: all 0.15s ease; text-decoration: none; }
    .btn-flat:hover { background: rgba(132, 164, 139, 0.15); border-color: rgba(132, 164, 139, 0.4); color: #ffffff; }
    .btn-flat.active { background: rgba(132, 164, 139, 0.2); border-color: #84A48B; color: #84A48B; }
    .search-box { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.18); color: #84A48B; padding: 5px 10px; border-radius: 6px; font-family: inherit; font-size: 10px; outline: none; width: 130px; transition: width 0.25s ease; }
    .search-box:focus { width: 170px; border-color: #84A48B; }
    .side-drawer { position: absolute; top: 48px; left: 8px; width: 310px; max-height: calc(100vh - 120px); overflow-y: auto; padding: 12px; pointer-events: auto; z-index: 90; transition: opacity 0.3s ease, transform 0.3s ease; border: 1px solid rgba(132, 164, 139, 0.25); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9); }
    .side-drawer.collapsed { opacity: 0; pointer-events: none; transform: translateX(-14px); }
    .side-drawer { scrollbar-width: thin; scrollbar-color: rgba(132,164,139,0.45) transparent; }
    .side-drawer::-webkit-scrollbar { width: 5px; }
    .side-drawer::-webkit-scrollbar-track { background: transparent; margin: 10px 0; }
    .side-drawer::-webkit-scrollbar-thumb { background: rgba(132,164,139,0.35); border-radius: 6px; }
    .side-drawer::-webkit-scrollbar-thumb:hover { background: rgba(132,164,139,0.7); }
    .side-drawer { overflow-x: hidden; }
    .rel-grid { display: flex; flex-direction: column; gap: 7px; }
    .rel-card { position: relative; box-sizing: border-box; min-width: 0; overflow: hidden; padding: 10px 44px 10px 15px; cursor: pointer; background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015)); border: 1px solid rgba(255,255,255,0.09); border-radius: 10px; transition: border-color .2s ease, background .2s ease, transform .2s ease, box-shadow .2s ease; }
    .rel-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--rel-color); opacity: .9; }
    .rel-card:hover { border-color: var(--rel-color); background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.025)); }
    .rel-card.inactive { opacity: .38; filter: grayscale(.85); }
    .rel-top { display: flex; align-items: center; gap: 10px; }
    .rel-title { flex: 1; min-width: 0; font-size: 11.5px; font-weight: 600; letter-spacing: .1px; color: #eef2f6; line-height: 1.25; overflow-wrap: break-word; hyphens: none; }
    .rel-desc { font-size: 10px; color: #8d99aa; line-height: 1.45; margin: 6px 0 0 32px; overflow-wrap: break-word; hyphens: none; }
    .rel-ico { display: none; color: var(--rel-color); font-size: 17px; line-height: 1; }
    .rel-n { position: absolute; top: 10px; right: 12px; padding: 1px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 700; font-family: ui-monospace, monospace; color: var(--rel-color); background: rgba(255,255,255,0.07); }
    #relTip { position: fixed; z-index: 400; display: none; width: 240px; padding: 11px 13px; border-radius: 10px; pointer-events: none; color: #eef2f6; background: rgba(12,16,22,0.97); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
    #relTip .rt-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 700; line-height: 1.25; }
    #relTip .rt-n { font-family: ui-monospace, monospace; font-size: 11px; padding: 1px 8px; border-radius: 99px; background: rgba(255,255,255,0.08); }
    #relTip .rt-d { margin-top: 6px; font-size: 10.5px; line-height: 1.45; color: #9aa6b6; }
    .drawer-header { font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; border-bottom: 1px solid rgba(255, 255, 255, 0.12); padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .cat-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.2s ease; position: relative; overflow: hidden; }
    .cat-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--cat-color, #84a48b); box-shadow: 0 0 10px var(--cat-color, #84a48b); }
    .cat-card:hover { border-color: rgba(132, 164, 139, 0.4); background: rgba(15, 23, 42, 0.9); transform: translateX(3px); }
    .cat-card.inactive { opacity: 0.35; filter: grayscale(0.8); transform: none !important; }
    .cat-label-wrap { display: flex; align-items: center; gap: 8px; }
    .cat-thumb { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--cat-color, #84a48b); flex-shrink: 0; }
    .badge-count { font-size: 10px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.15); padding: 2px 7px; border-radius: 6px; color: #84A48B; font-family: ui-monospace, monospace; font-weight: 700; }
    .toggle-box { width: 16px; height: 16px; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 4px; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.5); transition: all 0.15s; cursor: pointer; }
    .toggle-box.checked { background: var(--toggle-bg, #84A48B); border-color: var(--toggle-bg, #84A48B); }
    .toggle-box.checked::after { content: ""; width: 5px; height: 5px; background: #000000; border-radius: 1px; }
    .interaction-chips-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; }
    .inter-chip { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; padding: 5px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; transition: all 0.18s ease; text-align: center; }
    .inter-chip:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--inter-color, #84a48b); }
    .inter-chip.inactive { opacity: 0.32; filter: grayscale(0.7); }
    .inter-chip-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--inter-color, #84a48b); box-shadow: 0 0 6px var(--inter-color, #84a48b); }
    .inter-chip-title { font-size: 8.5px; font-weight: 700; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .inter-chip-badge { font-size: 8px; font-family: monospace; font-weight: 800; color: var(--inter-color, #84a48b); }
    .quick-toggle-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14); color: #cbd5e1; font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
    .quick-toggle-btn:hover { background: rgba(132, 164, 139, 0.25); border-color: #84a48b; color: #ffffff; transform: translateX(2px); }
    .node-inspector { position: absolute; top: 62px; right: 12px; width: 370px; max-height: calc(100vh - 140px); overflow-y: auto; pointer-events: auto; z-index: 150; border-left: 4px solid #84A48B; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .inspector-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; }
    .node-title { font-size: 14px; font-weight: 700; color: #84A48B; }
    .node-subtitle { font-size: 11px; font-style: italic; color: #cbd5e1; }
    .btn-close { cursor: pointer; color: #94a3b8; padding: 2px 8px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 4px; }
    .btn-close:hover { color: #ffffff; background: rgba(255, 255, 255, 0.1); }
    .media-preview { width: 100%; height: 145px; object-fit: cover; border-radius: 6px; margin-bottom: 12px; border: 1px solid rgba(255, 255, 255, 0.15); background: #000; }
    .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .metric-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; padding: 8px; }
    .metric-val { font-size: 13px; font-weight: 700; color: #84a48b; font-family: monospace; }
    .metric-lbl { font-size: 10px; color: #64748b; text-transform: uppercase; }
    .sec-header { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: #84a48b; margin-bottom: 4px; font-weight: 700; }
    .text-content { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; padding: 8px 10px; color: #cbd5e1; font-size: 11px; line-height: 1.4; margin-bottom: 10px; }
    .text-content.alert { background: rgba(201, 99, 73, 0.12); border-color: rgba(201, 99, 73, 0.35); color: #ff80a0; }
    .neighbor-scroll { max-height: 120px; overflow-y: auto; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; }
    .neighbor-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; }
    .neighbor-row:hover { background: rgba(132, 164, 139, 0.15); color: #84a48b; }
    .bottom-experience-bar, #camInspectorBox, #waypointsBar { display: none !important; }
    .waypoints-bar { position: absolute; top: 78px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; pointer-events: auto; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; }
    .waypoints-bar.show { opacity: 1; pointer-events: auto; }
    .waypoint-pill { padding: 7px 15px; border-radius: 16px; background: rgba(25, 25, 28, 0.88); border: 1px solid var(--glass-border); color: var(--ink); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(12px); transition: all 0.25s ease; display: flex; align-items: center; gap: 6px; }
    .waypoint-pill:hover, .waypoint-pill.active { color: #000; border-color: var(--accent); background: var(--accent); box-shadow: 0 0 14px var(--accent-glow); transform: translateY(-1px); }
    #activeTreeChip { position: absolute; top: 78px; right: 28px; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 6px; border-radius: 24px; background: rgba(18, 18, 22, 0.92); border: 1px solid rgba(132, 164, 139, 0.4); color: var(--ink); font-size: 11px; font-weight: 700; cursor: pointer; backdrop-filter: blur(16px); box-shadow: 0 8px 24px rgba(0,0,0,0.6); transition: all 0.3s ease; opacity: 0; pointer-events: none; transform: translateY(-6px); }
    #activeTreeChip.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
    #activeTreeChip:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.04); }
    #activeTreeChip img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--accent); }
    .bottom-control-capsule { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: auto; }
    .scrub-container { display: flex; align-items: center; gap: 16px; padding: 9px 22px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 36px; backdrop-filter: blur(24px); box-shadow: 0 16px 50px rgba(0, 0, 0, 0.9); transition: border-color 0.3s; }
    .scrub-container:hover { border-color: var(--accent); }
    .scrub-label { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; color: var(--ink-dim); text-transform: uppercase; cursor: pointer; transition: color 0.2s; }
    .scrub-label.active, .scrub-label:hover { color: var(--accent); text-shadow: 0 0 12px var(--accent); }
    .experience-toggle-btn { padding: 8px 20px; border-radius: 20px; font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 800; letter-spacing: 0.14em; cursor: pointer; border: 1px solid var(--accent); background: linear-gradient(135deg, #84A48B, #6B9080); color: #000; text-shadow: none; box-shadow: 0 0 20px var(--accent-glow); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .experience-toggle-btn:hover { transform: scale(1.06); box-shadow: 0 0 32px var(--accent-glow); }
    #activeTreeChip img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--accent); }
    /* Indicadores styles */
    .indicadores-modal-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.95); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); display: flex; align-items: center; justify-content: center; animation: modalFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    .indicadores-modal { width: 92%; max-width: 1120px; max-height: 90vh; background: #050505; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 18px; padding: 28px; overflow-y: auto; color: #f1f5f9; display: flex; flex-direction: column; gap: 20px; }
    .indicadores-modal .welcome-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.12); padding-bottom: 16px; }
    .pie-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .pie-card { background: #0a0a0c; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; overflow: hidden; }
    .pie-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.8; }
    .pie-card-title { font-size: 13px; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; text-align: center; text-transform: uppercase; }
    .pie-card-desc { font-size: 11px; color: #94a3b8; text-align: center; line-height: 1.4; }
    .pie-legend { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .legend-row { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; padding: 5px 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 6px; }
    .legend-label { display: flex; align-items: center; gap: 8px; color: #cbd5e1; font-weight: 500; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .close-btn { cursor: pointer; padding: 8px 14px; font-weight: 700; font-size: 12px; border-radius: 20px; border: 1px solid #84A48B; color: #84A48B; transition: all 0.2s; }
    .close-btn:hover { transform: translateY(-2px); background: rgba(132, 164, 139, 0.15); color: #ffffff; border-color: #84a48b; }
    .indicadores-button { padding: 8px 14px; border-radius: 20px; font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 800; letter-spacing: 0.14em; cursor: pointer; border: 1px solid var(--accent); background: linear-gradient(135deg, #84A48B, #6B9080); color: #000; text-shadow: none; box-shadow: 0 0 20px var(--accent-glow); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .indicadores-button:hover { transform: scale(1.06); box-shadow: 0 0 32px var(--accent-glow); }
    .indicadores-button.active { background: #E7C878; color: #000; box-shadow: 0 0 20px rgba(231, 200, 120, 0.5); }
    .indicadores-button:focus { outline: 2px solid #fff; outline-offset: 2px; }
    .indicador-modelo { background: #0a0a0c; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 20px 24px; }
    .indicador-modelo .indicador-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
    .indicador-modelo .indicador-titulo { font-weight: 800; font-size: 14px; color: #84A48B; }
    .indicador-modelo .indicador-descripcion { font-size: 11px; color: #94a3b8; }
    .indicador-modelo .indicador-imagen { width: 100px; height: 100px; border-radius: 8px; object-fit: cover; margin-right: 15px; border: 1.5px solid var(--accent); }
    .indicador-modelo .indicador-gradient { width: 60px; height: 20px; border-radius: 4px; object-fit: cover; margin-top: 10px; }
    .indicador-modelo .indicador-info { flex: 1; }
    .indicador-modelo .indicador-archivo { font-size: 11px; color: #cbd5e1; margin-bottom: 8px; }
    .indicador-modelo .indicador-nota { font-size: 10px; color: #64748b; }
    .indicador-modelo .btn-ver-servicio { margin-top: 10px; padding: 6px 12px; font-size: 10px; border: none; border-radius: 20px; background: #E7C878; color: #000; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .indicador-modelo .btn-ver-servicio:hover { background: #d4b39e; }
  </style>
</head>
<body>
  <div class="top-header" id="topHeader">
    <div class="nav-group">
      <div class="glass-panel brand-title">
        <span>HUMEDAL BURRO - INDICADORES</span>
      </div>
      <button class="glass-panel btn-flat indicadores-button active" id="btnIndicadoresGenerales" onclick="openIndicadoresGenerales()">
        <span>Indicadores</span>
      </button>
      <button class="glass-panel btn-flat indicadores-button" id="btnSE" onclick="openIndicador('SE')">
        <span>SE</span>
      </button>
      <button class="glass-panel btn-flat indicadores-button" id="btnPM" onclick="openIndicador('PM')">
        <span>PM</span>
      </button>
      <button class="glass-panel btn-flat indicadores-button" id="btnPA" onclick="openIndicador('PA')">
        <span>PA</span>
      </button>
      <button class="glass-panel btn-flat indicadores-button" id="btnOC" onclick="openIndicador('OC')">
        <span>OC</span>
      </button>
      <button class="glass-panel btn-flat indicadores-button" id="btnDC" onclick="openIndicador('DC')">
        <span>DC</span>
      </button>
      <button class="glass-panel btn-flat indicadores-button" id="btnCVA" onclick="openIndicador('CVA')">
        <span>CVA</span>
      </button>
      <button class="glass-panel btn-flat indicadores-button" id="btnCCL" onclick="openIndicador('CCL')">
        <span>CCL</span>
      </button>
    </div>
    <div class="nav-group">
      <button class="glass-panel btn-flat active" onclick="closeTodos()">
        <span>Cerrar</span>
      </button>
    </div>
  </div>

  <!-- Modal General Indicadores -->
  <div class="indicadores-modal-overlay" id="modalIndicadoresGenerales" style="display:none;">
    <div class="indicadores-modal" id="modalScrollGenerales">
      <div class="welcome-header">
        <div>
          <div style="font-size:16px; font-weight:900; color:#84A48B; letter-spacing:0.5px; display:flex; align-items:center; gap:8px;">
            <i class="fa-solid fa-chart-bar"></i> INDICADORES TERRITORIALES
          </div>
          <div style="font-size:11px; color:#94a3b8; margin-top:2px;">Métricas y indicadores clave del sistema socioecológico de Kennedy</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="close-btn" onclick="closeIndicadoresGenerales()">Cerrar</button>
        </div>
      </div>
      <div class="pie-grid" id="gridIndicadoresGenerales"></div>
    </div>
  </div>

  <!-- Modal Individual -->
  <div class="indicadores-modal-overlay" id="modalIndicadorIndividual" style="display:none;">
    <div class="indicadores-modal" id="modalScrollIndividual">
      <div class="welcome-header">
        <div>
          <div style="font-size:16px; font-weight:900; color:#84A48B; letter-spacing:0.5px; display:flex; align-items:center; gap:8px;">
            <span id="modalTituloIndicador"></span>
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="close-btn" onclick="closeModalIndividual()">Cerrar</button>
        </div>
      </div>
      <div class="indicador-modelo" id="contenidoIndicadorIndividual">
        <!-- Contenido dinámico -->
      </div>
    </div>
  </div>

  <script>
    // Datos de los indicadores (thumbnails y descripción desde MALLAS)
    const datosIndicadores = {
      SE: {
        titulo: 'MALLA SE',
        thumb: 'Synthesis Indicator1.png',
        gradient: 'Synthesis_Indicator_Gradient1.png',
        descripcion: 'Modelo 3D de la malla SE del humedal',
        archivo: 'MALLA SE.3dm',
        urlServicio: 'https://tu-servicio.cloud/malla-se'
      },
      PM: {
        titulo: 'MALLA PM',
        thumb: 'Synthesis Indicator2.png',
        gradient: 'Synthesis_Indicator_Gradient2.png',
        descripcion: 'Modelo 3D de la malla PM del humedal',
        archivo: 'PM MALLA.3dm',
        urlServicio: 'https://tu-servicio.cloud/malla-pm'
      },
      PA: {
        titulo: 'MALLA PA',
        thumb: 'Synthesis Indicator2.png',
        gradient: 'Synthesis_Indicator_Gradient2.png',
        descripcion: 'Modelo 3D de la malla PA del humedal',
        archivo: 'MALLA PA.3dm',
        urlServicio: 'https://tu-servicio.cloud/malla-pa'
      },
      OC: {
        titulo: 'MALLA OC',
        thumb: 'Synthesis Indicator1.png',
        gradient: 'Synthesis_Indicator_Gradient1.png',
        descripcion: 'Modelo 3D de la malla OC del humedal',
        archivo: 'OC MALLA.3dm',
        urlServicio: 'https://tu-servicio.cloud/malla-oc'
      },
      DC: {
        titulo: 'MALLA DC',
        thumb: 'Synthesis Indicator2.png',
        gradient: 'Synthesis_Indicator_Gradient2.png',
        descripcion: 'Modelo 3D de la malla DC del humedal',
        archivo: 'DC MALLA.3dm',
        urlServicio: 'https://tu-servicio.cloud/malla-dc'
      },
      CVA: {
        titulo: 'MALLA CVA',
        thumb: 'Synthesis Indicator2.png',
        gradient: 'Synthesis_Indicator_Gradient2.png',
        descripcion: 'Modelo 3D de la malla CVA del humedal',
        archivo: 'CV MALLA.3dm',
        urlServicio: 'https://tu-servicio.cloud/malla-cva'
      },
      CCL: {
        titulo: 'MALLA CCL',
        thumb: 'Synthesis Indicator3.png',
        gradient: 'Synthesis_Indicator_Gradient3.png',
        descripcion: 'Modelo 3D de la malla CCL del humedal',
        archivo: 'CCL MALLA.3dm',
        urlServicio: 'https://tu-servicio.cloud/malla-ccl'
      }
    };

    // Estado actual
    let modeloActual = null;

    // Botones de la cabecera
    const botonesIndicadores = document.querySelectorAll('.indicadores-button:not(.indicadores-button:first-child)');
    const btnIndicadoresGenerales = document.getElementById('btnIndicadoresGenerales');

    // Abrir modal general
    function openIndicadoresGenerales() {
      btnIndicadoresGenerales.classList.add('active');
      botonesIndicadores.forEach(b => b.classList.remove('active'));
      document.getElementById('modalIndicadoresGenerales').style.display = 'flex';
      renderizarGridIndicadoresGenerales();
    }

    // Cerrar modal general
    function closeIndicadoresGenerales() {
      btnIndicadoresGenerales.classList.remove('active');
      document.getElementById('modalIndicadoresGenerales').style.display = 'none';
    }

    // Renderizar grid del modal general
    function renderizarGridIndicadoresGenerales() {
      const grid = document.getElementById('gridIndicadoresGenerales');
      grid.innerHTML = '';
      Object.keys(datosIndicadores).forEach((clave, idx) => {
        const d = datosIndicadores[clave];
        const card = document.createElement('div');
        card.className = 'pie-card';
        card.innerHTML = `
          <div style="display:flex; gap:10px; margin-bottom:15px;">
            <img src="assets/${d.thumb}" alt="${d.titulo}" style="width:100px; height:100px; object-fit:cover; border-radius:8px;">
            <div>
              <div style="font-weight:700; color:#84A48B; font-size:14px;">${d.titulo}</div>
              <div style="font-size:11px; color:#94a3b8;">${d.descripcion}</div>
            </div>
          </div>
          <div style="display:flex; gap:5px;">
            <img src="assets/${d.gradient}" alt="${d.titulo} gradiente" style="width:60px; height:20px; object-fit:cover;">
          </div>
          <div style="margin-top:15px;">
            <p style="font-size:11px; color:#cbd5e1; margin-bottom:8px;">Archivo 3D: ${d.archivo} (formato .3dm - Rhino)</p>
            <p style="font-size:11px; color:#cbd5e1;">Nota: Los archivos .3dm tienen ~270MB. Para ver en 3D, se recomienda un visor Rhino Web o convertir a GLTF/USDZ.</p>
            <button class="btn-flat" style="margin-top:5px; padding:6px 12px; font-size:10px;" onclick="verEnServicio('${clave}')">Ver en mi servicio →</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Abrir modal individual
    function openIndicador(clave) {
      closeModalIndividual();
      const d = datosIndicadores[clave];
      modeloActual = clave;
      
      // Actualizar botones
      botonesIndicadores.forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      
      // Cargar contenido
      const contenedor = document.getElementById('contenidoIndicadorIndividual');
      contenedor.innerHTML = `
        <div class="indicador-modelo">
          <div class="indicador-header">
            <div>
              <div class="indicador-titulo">${d.titulo}</div>
              <div class="indicador-descripcion">${d.descripcion}</div>
            </div>
            <div class="indicador-imagen">
              <img src="assets/${d.thumb}" alt="${d.titulo}" style="width:100px; height:100px; object-fit:cover; border-radius:8px;">
            </div>
            <div class="indicador-gradient">
              <img src="assets/${d.gradient}" alt="${d.titulo} gradiente" style="width:60px; height:20px; object-fit:cover;">
            </div>
          </div>
          <div class="indicador-info">
            <p class="indicador-archivo">Archivo 3D: ${d.archivo} (formato .3dm - Rhino)</p>
            <p class="indicador-nota">Nota: Los archivos .3dm tienen ~270MB. Para ver en 3D en el navegador, se recomienda utilizar un visor Rhino Web o convertir a formato GLTF/USDZ.</p>
            <button class="btn-ver-servicio" onclick="verEnServicio('${clave}')">Ver en mi servicio →</button>
          </div>
        </div>
      `;
      
      document.getElementById('modalIndicadorIndividual').style.display = 'flex';
      document.getElementById('modalTituloIndicador').textContent = d.titulo;
    }

    // Cerrar modal individual
    function closeModalIndividual() {
      document.getElementById('modalIndicadorIndividual').style.display = 'none';
      if (modeloActual) {
        const btn = document.querySelector(`[onclick="openIndicador('${modeloActual}')"`);
        if (btn) btn.classList.remove('active');
      }
      modeloActual = null;
    }

    // Ver en servicio
    function verEnServicio(clave) {
      const d = datosIndicadores[clave];
      window.open(d.urlServicio, '_blank');
    }

    // Cerrar todos
    function closeTodos() {
      closeIndicadoresGenerales();
      closeModalIndividual();
      botonesIndicadores.forEach(b => b.classList.remove('active'));
      btnIndicadoresGenerales.classList.remove('active');
    }

    // Inicializar: ocultar modales y quitar active de todos los botones inicialmente
    document.addEventListener('DOMContentLoaded', () => {
      closeTodos();
      // Botón general activo por defecto
      btnIndicadoresGenerales.classList.add('active');
    });
  </script>
</body>
</html>
