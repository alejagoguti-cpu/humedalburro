<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulación 3D de tránsito — Kennedy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0c0f; --panel:rgba(255,255,255,.06); --panel-border:rgba(255,255,255,.12);
    --ink:#e8ecf1; --ink-dim:#8b96a5; --accent:#24c8bd;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{ background:var(--bg); color:var(--ink); font-family:Inter,Arial,sans-serif; overflow:hidden; }
  .app{ display:flex; min-height:100vh; }
  .main{ flex:1; position:relative; min-width:0; }
  #sceneWrap{ position:absolute; inset:0; }
  #sceneCanvas{ position:absolute; inset:0; display:block; width:100%; height:100%; }

  .hud-title{
    position:absolute; top:18px; left:18px; z-index:5; pointer-events:none;
  }
  .hud-title h1{ font-size:15px; font-weight:600; margin:0 0 3px; }
  .hud-title p{ font-size:11.5px; color:var(--ink-dim); margin:0; }

  .status-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--ink-dim); background:rgba(11,12,15,.6); z-index:8; text-align:center; padding:20px;
    pointer-events:none;
  }
  .status-overlay.hide{ display:none; }

  .controls-bar{
    position:absolute; left:50%; bottom:24px; transform:translateX(-50%); z-index:6;
    display:flex; align-items:center; gap:0; padding:0; border-radius:30px;
    background:transparent; border:none; backdrop-filter:none;
    transition: all .25s ease;
  }
  .controls-bar.expanded{
    gap:12px; padding:8px 16px; border-radius:14px;
    background:rgba(17,20,24,.92); border:1px solid var(--panel-border); backdrop-filter:blur(8px);
  }
  .controls-bar button#playPause{
    width:44px; height:44px; border-radius:50%; border:1px solid rgba(0,0,0,.15); background:#ffffff;
    color:#111418; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px;
    box-shadow: 0 4px 14px rgba(0,0,0,.28); flex-shrink:0; transition: transform .15s ease, background .15s ease;
  }
  .controls-bar button#playPause:hover{
    transform: scale(1.08); background:#f4f5f7;
  }
  .controls-bar .controls-expandable{
    display:none; align-items:center; gap:12px;
  }
  .controls-bar.expanded .controls-expandable{
    display:flex;
  }
  .controls-bar input[type=range]{ width:min(38vw,340px); accent-color:var(--accent); }
  .controls-bar .time-label{ font-size:11.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .controls-bar select{
    background:var(--panel); color:var(--ink); border:1px solid var(--panel-border); border-radius:8px;
    font-size:11.5px; padding:5px 8px;
  }

  .view-buttons{
    position:absolute; top:18px; right:18px; z-index:6; display:flex; flex-direction:column; gap:6px;
  }
  .view-buttons button{
    padding:8px 12px; border-radius:9px; border:1px solid var(--panel-border); background:rgba(17,20,24,.85);
    color:var(--ink); font-size:11.5px; cursor:pointer; text-align:left;
  }
  .view-buttons button:hover{ background:rgba(255,255,255,.1); }
  #goCorteBtn{ position:absolute; top:18px; right:18px; z-index:7; padding:8px 14px; border-radius:9px; border:1px solid var(--accent); background:rgba(36,200,189,.15); color:var(--accent); font-size:11.5px; cursor:pointer; backdrop-filter:blur(6px); }
  #goCorteBtn:hover{ background:rgba(36,200,189,.35); }

  .legend{
    position:absolute; bottom:78px; left:18px; z-index:5; font-size:11px; color:var(--ink-dim);
    background:rgba(17,20,24,.8); border:1px solid var(--panel-border); border-radius:10px; padding:10px 12px;
    display:flex; flex-direction:column; gap:5px;
  }
  .legend span{ display:flex; align-items:center; gap:7px; }
  .legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }

  .rotate-panel{
    position:absolute; top:104px; right:18px; z-index:6; width:220px;
    background:rgba(17,20,24,.92); border:1px solid var(--panel-border); border-radius:10px; padding:12px;
    display:flex; flex-direction:column; gap:8px;
  }
  .rotate-row{ display:flex; flex-direction:column; gap:4px; }
  .rotate-row label{ font-size:11px; color:var(--ink-dim); display:flex; justify-content:space-between; }
  .rotate-row input[type=range]{ width:100%; accent-color:var(--accent); }
  .rotate-row.rotate-buttons{ flex-direction:row; gap:8px; }
  .rotate-row button{
    flex:1; padding:7px 8px; border-radius:8px; border:1px solid var(--panel-border); background:var(--panel);
    color:var(--ink); font-size:10.5px; cursor:pointer;
  }
  .rotate-row button:hover{ background:rgba(255,255,255,.12); }
  #rotateOutput{
    width:100%; resize:vertical; font-family:monospace; font-size:10.5px; padding:6px; border-radius:6px;
    border:1px solid var(--panel-border); background:#0d0f12; color:var(--ink);
  }
  #sectionBoxToggle.active{ background:var(--accent); color:#0b0c0f; border-color:var(--accent); }
  input[type=color]{
    width:34px; height:24px; padding:0; border:1px solid var(--panel-border); border-radius:5px;
    background:none; cursor:pointer;
  }
  #colorOutput{
    width:100%; resize:vertical; font-family:monospace; font-size:10.5px; padding:6px; border-radius:6px;
    border:1px solid var(--panel-border); background:#0d0f12; color:var(--ink);
  }

  .draw-panel{
    position:absolute; top:70px; left:96px; z-index:110; width:230px;
    max-height:calc(100vh - 90px); overflow-y:auto;
    background:rgba(17,20,24,.92); border:1px solid var(--panel-border); border-radius:10px; padding:12px;
    display:flex; flex-direction:column; gap:8px;
  }
  .draw-panel #drawToggle.active, .draw-panel #treePlantToggle.active{ background:var(--accent); color:#0b0c0f; border-color:var(--accent); }
  .draw-hint{ font-size:10px; color:var(--ink-dim); margin:0; line-height:1.4; }
  #drawOutput, #treePlantOutput{
    width:100%; resize:vertical; font-family:monospace; font-size:10px; padding:6px; border-radius:6px;
    border:1px solid var(--panel-border); background:#0d0f12; color:var(--ink);
  }

  .tree-info{
    position:absolute; left:50%; top:70px; transform:translateX(-50%) translateY(-10px); z-index:20;
    width:min(300px, 88vw); background:rgba(17,20,24,.97); border:1px solid var(--panel-border);
    border-radius:12px; padding:16px 18px; box-shadow:0 10px 30px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .tree-info.show{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  .tree-info-close{
    position:absolute; top:10px; right:10px; width:24px; height:24px; border-radius:50%;
    border:1px solid var(--panel-border); background:var(--panel); color:var(--ink-dim);
    cursor:pointer; font-size:12px;
  }
  .tree-info-kind{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); margin:0 0 4px; }
  .tree-info h3{ font-size:14px; margin:0 26px 6px 0; color:var(--ink); }
  .tree-info p#treeInfoDetails{ font-size:12px; color:var(--ink-dim); margin:0; line-height:1.5; }
</style>
</head>
<body>
<div class="app">
  <main class="main" style="width:100vw; height:100vh; position:relative; overflow:hidden;">
    <div id="sceneWrap" style="position:absolute; inset:0;">
      <canvas id="sceneCanvas"></canvas>
    </div>

    <div class="hud-title" style="pointer-events:none;">
      <a href="index.html" style="text-decoration:none; display:inline-block; margin-bottom:6px; pointer-events:auto;"><button type="button" style="padding:6px 12px; border-radius:8px; border:1px solid var(--panel-border); background:rgba(17,20,24,.9); color:var(--ink); font-size:11.5px; font-weight:600; cursor:pointer;">← Volver al Humedal</button></a>
      <h1 style="font-size:16px; font-weight:700; margin:0 0 4px; display:flex; align-items:center; gap:8px;">
        Problemáticas — Evolución Histórica
        <span id="eraBadge" style="font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; background:rgba(36,200,189,.2); border:1px solid var(--accent); color:var(--accent);">1950</span>
      </h1>
      <p id="eraDesc" style="font-size:11.5px; color:var(--ink-dim); max-width:540px; margin:0; line-height:1.4;">1950 · Humedal El Burro y Sabana Rural (89% mayor extensión hídrica, potreros de pastoreo con ganado vacuno, sin vías ni urbanización).</p>
    </div>

    <div class="controls-bar" id="controlsBar" style="bottom:22px; padding:6px 14px; border-radius:24px; background:rgba(17,20,24,.92); border:1px solid var(--panel-border); backdrop-filter:blur(8px); display:flex; align-items:center; gap:12px;">
      <button type="button" id="histPlayPause" aria-label="Reproducir evolución histórica" style="width:38px; height:38px; border-radius:50%; border:1px solid rgba(0,0,0,.15); background:#ffffff; color:#111418; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 3px 12px rgba(0,0,0,.3); flex-shrink:0;"><i class="fa-solid fa-play"></i></button>
      
      <div style="display:flex; align-items:center; gap:6px;">
        <button type="button" class="year-btn active" data-year="1950" style="padding:5px 12px; border-radius:12px; border:1px solid var(--accent); background:rgba(36,200,189,.25); color:var(--accent); font-size:11.5px; font-weight:700; cursor:pointer;">1950</button>
        <button type="button" class="year-btn" data-year="1956" style="padding:5px 12px; border-radius:12px; border:1px solid var(--panel-border); background:rgba(255,255,255,.06); color:var(--ink); font-size:11.5px; font-weight:600; cursor:pointer;">1956</button>
        <input type="range" id="histYearSlider" min="1950" max="1956" value="1950" step="1" style="width:100px; accent-color:var(--accent); cursor:pointer; margin-left:6px;">
      </div>
    </div>

    <div class="status-overlay hide" id="statusOverlay"></div>

    <div class="tree-info" id="treeInfo">
      <button type="button" class="tree-info-close" id="treeInfoClose">✕</button>
      <p class="tree-info-kind">Árbol</p>
      <h3 id="treeInfoName"></h3>
      <p id="treeInfoDetails"></p>
    </div>

    <!-- Tarjeta de edición de color de edificio (techo + paredes) -->
    <div class="tree-info" id="buildingInfo" style="width:320px;">
      <button type="button" class="tree-info-close" id="buildingInfoClose">✕</button>
      <p class="tree-info-kind">Edificio seleccionado</p>
      <h3 id="buildingInfoTitle">Edificio</h3>
      <p id="buildingInfoDetails" style="margin-bottom:8px;"></p>
      
      <label style="font-size:11px; font-weight:600; color:var(--ink-dim); display:block; margin-bottom:6px;">Cambiar color (paredes + techo):</label>
      <div id="buildingColorPalette" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
        <button type="button" class="color-swatch" data-color="#ffffff" style="width:26px; height:26px; border-radius:6px; border:1px solid rgba(255,255,255,.3); background:#ffffff; cursor:pointer;" title="Blanco original"></button>
        <button type="button" class="color-swatch" data-color="#e8e4dc" style="width:26px; height:26px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:#e8e4dc; cursor:pointer;" title="Crema"></button>
        <button type="button" class="color-swatch" data-color="#d4aa6a" style="width:26px; height:26px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:#d4aa6a; cursor:pointer;" title="Ocre"></button>
        <button type="button" class="color-swatch" data-color="#d88a70" style="width:26px; height:26px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:#d88a70; cursor:pointer;" title="Terracota"></button>
        <button type="button" class="color-swatch" data-color="#789882" style="width:26px; height:26px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:#789882; cursor:pointer;" title="Verde sabana"></button>
        <button type="button" class="color-swatch" data-color="#6a8cae" style="width:26px; height:26px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:#6a8cae; cursor:pointer;" title="Azul pizarra"></button>
        <button type="button" class="color-swatch" data-color="#c88a96" style="width:26px; height:26px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:#c88a96; cursor:pointer;" title="Rosa ceniza"></button>
        <input type="color" id="buildingCustomColorPicker" value="#d88a70" style="width:30px; height:26px; padding:0; border:1px solid rgba(255,255,255,.2); border-radius:6px; background:none; cursor:pointer;" title="Color personalizado">
      </div>
      
      <textarea id="buildingColorConfigOutput" rows="3" readonly spellcheck="false" style="width:100%; font:9.5px/1.3 monospace; background:#0d0f12; color:var(--accent); border:1px solid var(--panel-border); border-radius:6px; padding:6px; margin-bottom:8px; resize:none;"></textarea>
      <button type="button" id="copyBuildingColorConfigBtn" style="width:100%; padding:7px 8px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#0b0c0f; font-size:11px; font-weight:700; cursor:pointer;">📋 Copiar cambios de color</button>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="modulo-08-3d.js?v=205"></script>
</body>
</html>
